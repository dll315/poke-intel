# Replace SERVER_IP with the same public IPv4 address in every occurrence.
server {
    listen 80;
    server_name SERVER_IP;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://SERVER_IP$request_uri; }
}
server {
    listen 443 ssl;
    server_name SERVER_IP;
    ssl_certificate /etc/letsencrypt/live/SERVER_IP/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/SERVER_IP/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 32k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
