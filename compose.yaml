services:
  app:
    build:
      context: .
      args:
        VITE_ICP_NUMBER: ${VITE_ICP_NUMBER:-}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3001
      TRUST_PROXY: "1"
      ORIGIN: ${ORIGIN:?请在 .env 中设置自己的 HTTPS 域名}
      DB_PATH: /app/data/poke.db
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - poke-data:/app/data
      - ./backups:/app/backups
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/api/v1/status').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  poke-data:
