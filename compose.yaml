services:
  app:
    build:
      context: .
      args:
        VITE_ICP_NUMBER: ${VITE_ICP_NUMBER:-}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3001
      TRUST_PROXY: "1"
      ORIGIN: ${ORIGIN:?请在 .env 中设置自己的 HTTPS 域名}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      DB_PATH: /app/data/poke.db
      WECOM_WEBHOOK_URL: ${WECOM_WEBHOOK_URL:-}
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:-}
      ALPHAPEDIA_ENABLED: ${ALPHAPEDIA_ENABLED:-0}
      ALPHAPEDIA_PERMISSION_CONFIRMED: ${ALPHAPEDIA_PERMISSION_CONFIRMED:-0}
      ALPHA_MONITOR_ENABLED: ${ALPHA_MONITOR_ENABLED:-0}
      ALPHA_MONITOR_INTERVAL_SECONDS: ${ALPHA_MONITOR_INTERVAL_SECONDS:-30}
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - poke-data:/app/data
      - ./backups:/app/backups
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/api/v1/status').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  poke-data:
